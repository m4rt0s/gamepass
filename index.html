<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xbox Game Pass - Juegos por Tier</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <h1>🎮 Xbox Game Pass</h1>
                <p class="subtitle">Cargando...</p>
            </div>
        </header>

        <div class="platform-filter-bar" id="platform-filter-bar">
            <button class="platform-btn active" data-platform="all">Todas</button>
            <button class="platform-btn" data-platform="console">🎮 Consola</button>
            <button class="platform-btn" data-platform="pc">🖥️ PC</button>
            <button class="platform-btn" data-platform="both">🎮🖥️ Ambas</button>
        </div>

        <div class="tier-quick-filter" id="tier-quick-filter">
            <button class="tier-btn active" data-tier="all">Todos</button>
            <button class="tier-btn" data-tier="essential">
                <span class="tier-dot essential"></span> Essential
            </button>
            <button class="tier-btn" data-tier="premium">
                <span class="tier-dot premium"></span> Premium
            </button>
            <button class="tier-btn" data-tier="ultimate">
                <span class="tier-dot ultimate"></span> Ultimate
            </button>
            <button class="tier-btn" data-tier="pc">
                <span class="tier-dot pc"></span> PC Game Pass
            </button>
        </div>

        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-filter" placeholder="Buscar por nombre, desarrollador o categoría...">
            </div>

            <div class="filter-row">
                <select id="sort-filter">
                    <option value="title-asc">A → Z</option>
                    <option value="title-desc">Z → A</option>
                    <option value="rating-desc">Mejor valorados</option>
                    <option value="rating-desc-count">Más votados</option>
                    <option value="release-desc">Más recientes</option>
                    <option value="release-asc">Más antiguos</option>
                    <option value="price-asc">Precio: menor a mayor</option>
                    <option value="price-desc">Precio: mayor a menor</option>
                </select>

                <select id="category-filter">
                    <option value="all">Todas las categorías</option>
                </select>

                <label class="checkbox-label">
                    <input type="checkbox" id="discount-filter"> Con descuento
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="exclusive-filter"> Solo exclusivos del tier
                </label>
            </div>
        </div>

        <div class="stats" id="stats">
            <span class="stat"><strong id="total-games">0</strong> total</span>
            <span class="stat"><strong id="essential-count">0</strong> essential</span>
            <span class="stat"><strong id="premium-count">0</strong> premium</span>
            <span class="stat"><strong id="ultimate-count">0</strong> ultimate</span>
            <span class="stat"><strong id="pc-count">0</strong> pc game pass</span>
            <span class="stat"><strong id="discount-count">0</strong> ofertas</span>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Cargando juegos...</p>
        </div>

        <div class="error" id="error" style="display: none;">
            <p id="error-message"></p>
            <button onclick="loadGames()" class="btn-retry">Reintentar</button>
        </div>

        <div class="results-info" id="results-info"></div>

        <main class="games-grid" id="games-grid"></main>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modal-close">✕</button>
            <div class="modal-content" id="modal-content"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
